name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。実行中のデプロイは完了させる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 型チェックとテスト
        run: |
          npm run typecheck
          npm run test:run

      - name: ビルド
        # GitHub Pages はリポジトリ名のサブディレクトリで配信されるため、
        # アセットとマニフェストのパスを合わせる
        env:
          VITE_BASE_PATH: /kintore-note/
        run: npm run build

      # enablement: true で、リポジトリ側の Pages 設定も自動で有効化する
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
